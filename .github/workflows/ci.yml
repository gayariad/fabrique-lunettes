name: CI - Tests et Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests JUnit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Lancer les tests Maven
        run: mvn -B test --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier les resultats des tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultats JUnit
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit

  prepare-release:
    name: Preparer le tag de release
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Generer le tag de version
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Creer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            Release automatique generee par GitHub Actions.
            Commit : ${{ github.sha }}

            ## Client JavaFX (aucune installation requise)
            Telechargez le fichier correspondant a votre OS :
            - **Windows** : `FabriqueLunettes-win.exe` — double-cliquez pour installer, puis lancez depuis le Bureau
            - **Linux** : `FabriqueLunettes-linux.zip` — dezippez et lancez `FabriqueLunettes/bin/FabriqueLunettes`
            - **macOS** : `FabriqueLunettes-mac.dmg` — ouvrez le DMG et glissez l'app dans Applications

            Java est inclus, aucune installation requise.

            ## Backend
            Requiert Java 17+. Lancement : `java -jar backend-runnable.jar`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-backend:
    name: Release Backend
    runs-on: ubuntu-latest
    needs: prepare-release
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Compiler et packager le backend
        run: mvn -B package -DskipTests --no-transfer-progress -pl backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attacher backend-runnable.jar a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: backend/target/backend-runnable.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-client-windows:
    name: Release Client (Windows)
    runs-on: windows-latest
    needs: prepare-release
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Java 21 avec JavaFX full JDK (Liberica inclut JavaFX nativement)
      - name: Installer Liberica JDK 21 avec JavaFX
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: jdk+fx

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~\.m2\repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: jdk+fx
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Compiler le client (sans tests)
        run: mvn -B package -DskipTests --no-transfer-progress -pl client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Creer l'image applicative avec jpackage
        shell: pwsh
        run: |
          Copy-Item client\target\client-runnable.jar client\target\jpackage-input\

          jpackage `
            --type app-image `
            --name FabriqueLunettes `
            --input client\target\jpackage-input `
            --main-jar client-runnable.jar `
            --main-class com.lunettes.App `
            --java-options "--add-opens javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" `
            --dest dist-win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compresser en zip
        shell: pwsh
        run: Compress-Archive -Path dist-win\FabriqueLunettes -DestinationPath FabriqueLunettes-win.zip

      - name: Attacher FabriqueLunettes-win.zip a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: FabriqueLunettes-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-client-linux:
    name: Release Client (Linux)
    runs-on: ubuntu-latest
    needs: prepare-release
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Liberica JDK 21 avec JavaFX
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: jdk+fx

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: jdk+fx
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Compiler le client (sans tests)
        run: mvn -B package -DskipTests --no-transfer-progress -pl client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Creer l'image applicative avec jpackage
        run: |
          cp client/target/client-runnable.jar client/target/jpackage-input/

          jpackage \
            --type app-image \
            --name FabriqueLunettes \
            --input client/target/jpackage-input \
            --main-jar client-runnable.jar \
            --main-class com.lunettes.App \
            --java-options "--add-opens javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --dest dist-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compresser en zip
        run: cd dist-linux && zip -r ../FabriqueLunettes-linux.zip FabriqueLunettes/

      - name: Attacher FabriqueLunettes-linux.zip a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: FabriqueLunettes-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-client-mac:
    name: Release Client (macOS)
    runs-on: macos-latest
    needs: prepare-release
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Liberica JDK 21 avec JavaFX
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: jdk+fx

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: jdk+fx
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Compiler le client (sans tests)
        run: mvn -B package -DskipTests --no-transfer-progress -pl client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Creer le DMG avec jpackage
        run: |
          cp client/target/client-runnable.jar client/target/jpackage-input/

          jpackage \
            --type dmg \
            --name FabriqueLunettes \
            --input client/target/jpackage-input \
            --main-jar client-runnable.jar \
            --main-class com.lunettes.App \
            --java-options "--add-opens javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --dest dist-mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attacher FabriqueLunettes-mac.dmg a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: dist-mac/FabriqueLunettes-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
