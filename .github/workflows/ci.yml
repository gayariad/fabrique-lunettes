name: CI - Tests et Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1 : tests JUnit sur tous les modules
  tests:
    name: Tests JUnit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Lancer les tests Maven
        run: mvn -B test --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier les resultats des tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultats JUnit
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit

  # Job 2 : backend fat JAR (une seule fois, pas de natif)
  release-backend:
    name: Release Backend
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Compiler et packager le backend
        run: mvn -B package -DskipTests --no-transfer-progress -pl backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generer le tag de version
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Creer la Release GitHub avec le backend
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            Release automatique generee par GitHub Actions.
            Commit : ${{ github.sha }}

            ## Client JavaFX (autonome, sans installation requise)
            Telechargez l'archive correspondant a votre OS :
            - `client-win.zip` pour Windows
            - `client-linux.zip` pour Linux
            - `client-mac.zip` pour macOS

            Dezippez et lancez `bin/client` (Linux/macOS) ou `bin\client.bat` (Windows).
            Java et JavaFX sont inclus dans l'archive.

            ## Backend
            Requiert Java 17+. Lancement : `java -jar backend-runnable.jar`
          files: backend/target/backend-runnable.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Jobs 3a/3b/3c : client JavaFX en parallele pour les 3 OS.
  # Chaque job tourne sur le runner natif de la plateforme cible :
  # le profil Maven (javafx-win/linux/mac) s'active automatiquement
  # et telecharge les JARs JavaFX natifs correspondants.
  # jlink produit une image autonome : JRE minimal + JavaFX + appli.
  release-client-windows:
    name: Release Client (Windows)
    runs-on: windows-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~\.m2\repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Construire l'image runtime Windows
        run: mvn -B verify -DskipTests --no-transfer-progress -pl client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generer le tag de version
        id: version
        run: echo "tag=v$(Get-Date -Format 'yyyy.MM.dd')-${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Attacher client-win.zip a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: client/target/client-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-client-linux:
    name: Release Client (Linux)
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Construire l'image runtime Linux
        run: mvn -B verify -DskipTests --no-transfer-progress -pl client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generer le tag de version
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Attacher client-linux.zip a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: client/target/client-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-client-mac:
    name: Release Client (macOS)
    runs-on: macos-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configurer settings.xml pour GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github-fabricateur
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Construire l'image runtime macOS
        run: mvn -B verify -DskipTests --no-transfer-progress -pl client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generer le tag de version
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Attacher client-mac.zip a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: client/target/client-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
